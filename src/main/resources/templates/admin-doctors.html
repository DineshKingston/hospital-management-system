<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctors List</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="container">
    <h2>Doctors</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Specialization</th>
            <th>Delete</th>
            <th>Reset Password</th>
        </tr>

        <tr th:each="d : ${doctors}">
            <td th:text="${d.name}"></td>
            <td th:text="${d.email}"></td>
            <td th:text="${d.specialization}"></td>

            <!-- Delete -->
            <td>
                <a th:href="@{/admin/delete-doctor/{id}(id=${d.id})}"
                   class="btn action-delete"
                   onclick="return confirm('Delete this doctor?')">
                    Delete
                </a>
            </td>

            <!-- Reset Password -->
            <td>
                <form th:action="@{/admin/reset-doctor-password}" method="post"
                      style="display:flex; gap:5px;">
                    
                    <input type="hidden" name="doctorId" th:value="${d.id}">
                    <input type="password" name="newPassword"
                           placeholder="New Password" required>

                    <button class="btn">Reset</button>
                </form>
            </td>
        </tr>
    </table>

    <br>
    <a th:href="@{/admin/dashboard}" class="btn">Back</a>
</div>

<div th:replace="fragments/header :: body"></div>
</body>
</html>

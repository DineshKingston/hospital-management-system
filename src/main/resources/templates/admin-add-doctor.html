<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Doctor</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="container">
    <h2>Add Doctor</h2>

    <p style="color:red" th:text="${error}"></p>

    <form th:action="@{/admin/add-doctor}" th:object="${doctor}" method="post">

        <input type="text" th:field="*{name}" placeholder="Doctor Name" required>
        <input type="email" th:field="*{email}" placeholder="Email" required>
        <input type="password" th:field="*{password}" placeholder="Password" required>
        <input type="text" th:field="*{specialization}" placeholder="Specialization" required>

        <button class="btn">Save Doctor</button>
    </form>

    <br>
    <a href="/admin/dashboard" class="btn">Back</a>
</div>
<div th:replace="fragments/header :: body"></div>
</body>
</html>
